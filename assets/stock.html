<html lang="en">
<head>
    <link href="/assets/fonts/OpenSans-Light.ttf" rel="stylesheet">
    <title>Janya Joshi</title>
</head>
<style>
    @font-face {
        font-family: 'Open Sans Light';
        src: url('/assets/fonts/OpenSans-Light.ttf') format('truetype');
        font-weight: 300; /* Adjust as per font weight */
        font-style: normal;
    }
    .content {
        width: 30%;
    }
    @media (min-width: 0px) {
        .content {
            width: 100%;
        }
    }
    @media (min-width: 700px) {
        .content {
            width: 80%;
        }
    }
    @media (min-width: 800px) {
        .content {
            width: 70%;
        }
    }
    @media (min-width: 1000px) {
        .content {
            width: 56%;
        }
    }
    @media (min-width: 1200px) {
        .content {
            width: 47%;
        }
    }
    @media (min-width: 1400px) {
        .content {
            width: 40%;
        }
    }
    @media (min-width: 1600px) {
        .content {
            width: 35%;
        }
    }
    @media (min-width: 1800px) {
        .content {
            width: 31%;
        }
    }
    @media (min-width: 1900px) {
        .content {
            width: 29%;
        }
    }
</style>
<body style="
            background : black;
            font-size: 14px;
            font-optical-sizing: auto;
            font-weight: 300;
            font-style: normal;
            font-family: 'Open Sans Light', sans-serif;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;">
<div style="height: 100%;" class="content">
    <br/>
    <span style="color: white">Prefer Terminal ? </span>
    <br/>
    <span style="color: chartreuse">curl {url}</span>
    {content}
</div>
</body>
</html>
